[package]
name = "BREP_docs"
version = "0.1.1"
edition = "2021"
license-file = "LICENSE.md"
description = "The static HTML help-site generator for the BREP CAD application: renders a BREP source tree's user docs, icons and licence notices into a searchable site."
repository = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL"
homepage = "https://v2.brep.io"
readme = "README.md"
keywords = ["documentation", "static-site", "markdown", "help", "cad"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.92"
include = [
    "src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.md",
    # Test code never ships, whatever else a pattern above matches.
    "!src/**/tests/**",
    "!**/tests.rs",
    "!**/*_tests.rs",
    "!**/test_support.rs",
    "!**/testdata/**",
]

[[bin]]
name = "brep-docs"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13"
serde_json = "1"
