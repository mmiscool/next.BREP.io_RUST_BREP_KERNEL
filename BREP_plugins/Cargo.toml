[package]
name = "BREP_plugins"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
description = "Pinned JavaScript CAD package runtime"
repository = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL"
homepage = "https://v2.brep.io"
readme = "README.md"
include = ["src/**/*.rs", "src/host.js", "/Cargo.toml", "/README.md", "/LICENSE.md", "!src/tests.rs", "!src/**/tests/**"]
[lib]
name = "brep_plugins"
[dependencies]
brep_kernel = { package = "BREP_kernel", version = "0.8.0", path = "../BREP_kernel" }
brep_script_core = { package = "BREP_script_core", version = "0.1.2", path = "../BREP_script_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
