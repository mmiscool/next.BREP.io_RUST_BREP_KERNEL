[package]
name = "BREP_ecad_egui"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
license-file = "LICENSE.md"
description = "Embeddable egui editors for schematics, wiring diagrams, boards, symbols, and pads."
repository = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL"
homepage = "https://v2.brep.io"
readme = "README.md"
keywords = ["ecad", "egui", "schematic", "pcb", "editor"]
categories = ["gui", "science", "visualization"]
include = [
    "src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.md",
    # Test code never ships, whatever else a pattern above matches.
    "!src/**/tests/**",
    "!**/tests.rs",
    "!**/*_tests.rs",
    "!**/test_support.rs",
    "!**/testdata/**",
]

[lib]
# Published package is BREP_ecad_egui; the lib name is the idiomatic lowercase
# `brep_ecad_egui`, the symbol every `use brep_ecad_egui::` keys off.
name = "brep_ecad_egui"

[dependencies]
BREP_ecad_core = { version = "0.2.1", path = "../BREP_ecad_core" }
egui = "0.35"

[profile.dev.package.BREP_ecad_core]
opt-level = 2
