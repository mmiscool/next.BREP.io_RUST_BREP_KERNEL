[package]
name = "BREP_reconstruction"
version = "0.25.0"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL"
homepage = "https://next.brep.io"
description = "Rust B-rep CAD kernel (next.BREP.io): kernel integration for neutral BREP_RANSAC recognition results (mesh to B-rep reconstruction)."
readme = "README.md"
keywords = ["cad", "brep", "b-rep", "reconstruction", "step"]
categories = ["algorithms", "graphics", "mathematics"]
# The `!` entries are a backstop: test code never ships. The publish snapshot
# `cargo package` of this manifest from shipping test files.
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE.md",
    "!src/**/tests/**",
    "!**/tests.rs",
    "!**/*_tests.rs",
    "!**/test_support.rs",
    "!**/testdata/**",
]

[lib]
name = "brep_reconstruction"

[dependencies]
# Monotonic timing on native targets and in browser workers.
web-time = "1"
BREP_RANSAC = { version = "0.2.3", path = "../BREP_RANSAC" }
BREP_kernel = { version = "=0.28.0", path = "../BREP_kernel" }
serde = { version = "1", features = ["derive"] }

