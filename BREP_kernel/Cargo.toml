[package]
name = "BREP_kernel"
version = "0.32.1"
edition = "2021"
license-file = "LICENSE.md"
description = "Rust B-rep CAD kernel (next.BREP.io): a boundary representation (B-rep) geometry kernel for building CAD applications, native and WebAssembly."
repository = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL"
homepage = "https://next.brep.io"
readme = "README.md"
keywords = ["cad", "brep", "b-rep", "nurbs", "kernel"]
categories = ["mathematics", "graphics", "algorithms"]
# Only production sources and package metadata are published.
# The `!` entries are a backstop: test code never ships. The publish snapshot
# `cargo package` of this manifest from shipping test files.
include = [
    "src/**/*.rs",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.md",
    "!src/**/tests/**",
    "!**/tests.rs",
    "!**/*_tests.rs",
    "!**/test_support.rs",
    "!**/testdata/**",
]

[lib]
# Published package is BREP_kernel; the lib name is the idiomatic lowercase
# `brep_kernel` — the symbol every `use brep_kernel::` (BREP_render, benches,
# examples) and the wasm-pack artifact names key off.
name = "brep_kernel"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3           # aggressive opts: loop unrolling + vectorization
lto = "fat"             # full cross-crate Link-Time Optimization
codegen-units = 1       # single codegen unit lets LLVM optimize globally
panic = "abort"         # drop unwinding code (wasm can't unwind anyway) — smaller/faster
overflow-checks = false # no arithmetic overflow checks in hot paths

[dependencies]
BREP_solvers = { version = "0.32.1", path = "../BREP_solvers" }
BREP_surface_offset = { version = "0.32.1", path = "../BREP_surface_offset" }
BREP_boolean = { version = "0.32.1", path = "../BREP_boolean" }
BREP_construction = { version = "0.32.1", path = "../BREP_construction" }
BREP_blend = { version = "0.32.1", path = "../BREP_blend" }
BREP_offset = { version = "0.32.1", path = "../BREP_offset" }
BREP_direct_edit = { version = "0.32.1", path = "../BREP_direct_edit" }
BREP_geometry = { version = "0.32.1", path = "../BREP_geometry" }
BREP_topology = { version = "0.32.1", path = "../BREP_topology" }
# Robust single-region surface fitting for the Refit Faces edit (the same
# RANSAC + least-squares pass the mesh import runs). A geometry leaf: no cycle.
BREP_RANSAC = { version = "0.2.3", path = "../BREP_RANSAC" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
slotmap = "1"
rustc-hash = "2"
wasm-bindgen = "0.2"
web-time = "1"
spade = "=2.15.1"
rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "1", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Optional wasm global allocator (feature `wasm-talc`); MIT, no_std.
talc = { version = "5.1.1", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Optional native global allocator (feature `native-rusty-alloc`): rusty_alloc,
# a pure-Rust mimalloc remake (MIT); the same API crate version the desktop app
# already links through rusty_h264-common's default `global-alloc` feature.
rusty_alloc-api = { version = "=2.2.6", optional = true }

[features]
# Diagnostic wall-time partition; ordinary builds compile the hooks away.
profile-wall = ["BREP_geometry/profile-wall", "BREP_topology/profile-wall", "BREP_surface_offset/profile-wall", "BREP_boolean/profile-wall", "BREP_construction/profile-wall", "BREP_blend/profile-wall", "BREP_offset/profile-wall", "BREP_direct_edit/profile-wall", "BREP_solvers/profile-wall"]
# `parallel` turns the per-face tessellation loop into a rayon par_iter. It
# works on native (rayon's own pool) and on wasm built with atomics. The
# DEFAULT build enables neither feature, so the shipped wasm is byte-identical
# to before. `wasm-threads` additionally pulls in wasm-bindgen-rayon so the
# browser can spin up a shared-memory thread pool (requires an atomics build +
# COOP/COEP headers — see build:rust-kernel:threads).
parallel = ["dep:rayon", "BREP_geometry/parallel", "BREP_topology/parallel", "BREP_surface_offset/parallel", "BREP_boolean/parallel", "BREP_construction/parallel", "BREP_blend/parallel", "BREP_offset/parallel", "BREP_direct_edit/parallel", "BREP_solvers/parallel"]
wasm-threads = ["parallel", "dep:wasm-bindgen-rayon"]
# `wasm-talc` replaces Rust's default wasm allocator (dlmalloc) with talc on
# single-threaded wasm builds. Native builds are unaffected.
wasm-talc = ["dep:talc"]
# `native-rusty-alloc` replaces the system allocator with rusty_alloc on native
# builds (headless drivers, benches, servers). Never in a graph that already has
# a global allocator, such as BREP_app's (rusty_h264-common installs this same
# allocator there): Rust allows one per program.
native-rusty-alloc = ["dep:rusty_alloc-api", "BREP_geometry/native-rusty-alloc", "BREP_topology/native-rusty-alloc", "BREP_surface_offset/native-rusty-alloc", "BREP_boolean/native-rusty-alloc", "BREP_construction/native-rusty-alloc", "BREP_blend/native-rusty-alloc", "BREP_offset/native-rusty-alloc", "BREP_direct_edit/native-rusty-alloc", "BREP_solvers/native-rusty-alloc"]

