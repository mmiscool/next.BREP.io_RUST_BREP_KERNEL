[package]
name = "BREP_simulation"
version = "0.1.4"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL"
homepage = "https://next.brep.io"
description = "Motion studies for next.BREP.io (Rust B-rep CAD) assemblies: the study document model, mates as motors, the timeline's clips and sampling a study at a time."
readme = "README.md"
keywords = ["cad", "b-rep", "assembly", "simulation", "motion"]
categories = ["data-structures", "simulation"]
# The `!` entries are a backstop: test code never ships.
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE.md",
    "!src/**/tests/**",
    "!**/tests.rs",
    "!**/*_tests.rs",
    "!**/test_support.rs",
    "!**/testdata/**",
]

[lib]
name = "brep_simulation"

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
